<!DOCTYPE html>
<html>
<head>
  <title>Guess The Lyric</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="home">

  <h1 class="title">Guess The Lyric 🎤</h1>
  <p class="subtitle">Pick a genre</p>

  <div class="grid">
    <div class="card pop" onclick="startGame('pop')">Pop</div>
    <div class="card rap" onclick="startGame('rap')">Rap</div>
    <div class="card rnb" onclick="startGame('rnb')">R&B</div>
    <div class="card musicals" onclick="startGame('musicals')">Musicals</div>
  </div>

  <script>
    function startGame(genre) {
      window.location.href = "game.html?genre=" + genre;
    }
  </script>

</body>
</html>
